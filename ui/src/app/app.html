@if (store.state() === 'unauthorized') {
  <anv-locked />
} @else {
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <anv-sidebar />
    <div class="column">
      <anv-topbar />
      <main id="main" tabindex="-1">
        <anv-status-banner />
        <router-outlet />
      </main>
    </div>
  </div>
  <anv-dialog-host />
  <anv-notices />
  <anv-celebration />
  <anv-shortcuts />
  <anv-palette />
  <anv-new-item />
}
